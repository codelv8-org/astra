name: CrewNest checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:rust
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/cargo.ps1 -Action ipc-test
      - run: pnpm build
      - run: pnpm build:web
      - run: pnpm build:api
      - run: pnpm test:e2e
      - run: pnpm desktop:build
